<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Brick studio (3D)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=block">
<style>
  html, body { margin: 0; background: #1b1820; color: #eee; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; }
  #out { width: min(100%, 1280px); aspect-ratio: 16 / 9; height: auto; background: #222; }
  .bar { display: flex; gap: 10px; align-items: center; max-width: 1280px; } #scrub { flex: 1; }
</style>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }</script>
<!-- data: config, lyrics, baked LDraw parts (classic scripts, run first) -->
<script src="src/config.js"></script>
<script src="src/lyrics.js"></script>
<script src="parts/parts.js"></script>
</head>
<body>
<main>
  <canvas id="out" width="1920" height="1080"></canvas>
  <div class="bar"><input id="scrub" type="range" min="0" max="11" step="0.0417" value="0"><span id="tt">loading…</span></div>
</main>
<!-- engine + cast (modules run in order, after the classic scripts above) -->
<script type="module" src="src3d/engine.js"></script>
<script type="module" src="src3d/cast3d.js"></script>
<!-- SCENES: one module tag per chapter file, in song order -->
<!-- /SCENES -->
<script type="module">
  const q = new URLSearchParams(location.search).get('loop'); if (q && LOOPS[q]) window.LOOP = LOOPS[q];
  ENGINE3D.start();
</script>
</body>
</html>
